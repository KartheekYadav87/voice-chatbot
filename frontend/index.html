<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>VoiceBot - Voice Enabled AI Chatbot</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        :root {
            --primary: #6366f1;
            --primary-dark: #4f46e5;
            --primary-light: #818cf8;
            --bg: #0f172a;
            --bg-secondary: #1e293b;
            --bg-tertiary: #334155;
            --text: #f1f5f9;
            --text-muted: #94a3b8;
            --user-bubble: #6366f1;
            --bot-bubble: #1e293b;
            --success: #22c55e;
            --error: #ef4444;
            --border: #334155;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Oxygen, Ubuntu, sans-serif;
            background: var(--bg);
            color: var(--text);
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            align-items: center;
        }

        .header {
            width: 100%;
            padding: 20px;
            background: var(--bg-secondary);
            border-bottom: 1px solid var(--border);
            text-align: center;
        }

        .header h1 {
            font-size: 1.5rem;
            font-weight: 700;
            background: linear-gradient(135deg, var(--primary-light), var(--primary));
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            background-clip: text;
        }

        .header p {
            font-size: 0.85rem;
            color: var(--text-muted);
            margin-top: 4px;
        }

        .status-bar {
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 8px;
            margin-top: 8px;
            font-size: 0.75rem;
        }

        .status-dot {
            width: 8px;
            height: 8px;
            border-radius: 50%;
            background: var(--success);
            animation: pulse 2s infinite;
        }

        .status-dot.disconnected {
            background: var(--error);
            animation: none;
        }

        @keyframes pulse {
            0%, 100% { opacity: 1; }
            50% { opacity: 0.5; }
        }

        .chat-container {
            flex: 1;
            width: 100%;
            max-width: 800px;
            display: flex;
            flex-direction: column;
            padding: 20px;
        }

        .chat-messages {
            flex: 1;
            overflow-y: auto;
            padding: 20px 0;
            display: flex;
            flex-direction: column;
            gap: 16px;
        }

        .message {
            display: flex;
            gap: 12px;
            max-width: 85%;
            animation: slideIn 0.3s ease;
        }

        @keyframes slideIn {
            from { opacity: 0; transform: translateY(10px); }
            to { opacity: 1; transform: translateY(0); }
        }

        .message.user {
            align-self: flex-end;
            flex-direction: row-reverse;
        }

        .message.bot {
            align-self: flex-start;
        }

        .message-avatar {
            width: 36px;
            height: 36px;
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 1rem;
            flex-shrink: 0;
        }

        .message.user .message-avatar {
            background: var(--primary);
        }

        .message.bot .message-avatar {
            background: var(--bg-tertiary);
        }

        .message-content {
            display: flex;
            flex-direction: column;
            gap: 4px;
        }

        .message-bubble {
            padding: 12px 16px;
            border-radius: 18px;
            font-size: 0.9rem;
            line-height: 1.5;
            word-wrap: break-word;
        }

        .message.user .message-bubble {
            background: var(--user-bubble);
            color: white;
            border-bottom-right-radius: 4px;
        }

        .message.bot .message-bubble {
            background: var(--bot-bubble);
            border: 1px solid var(--border);
            border-bottom-left-radius: 4px;
        }

        .message-meta {
            font-size: 0.7rem;
            color: var(--text-muted);
            padding: 0 4px;
        }

        .message.user .message-meta {
            text-align: right;
        }

        .recognized-text {
            font-size: 0.75rem;
            color: var(--text-muted);
            font-style: italic;
            padding: 4px 8px;
            background: rgba(99, 102, 241, 0.1);
            border-radius: 8px;
            margin-bottom: 4px;
        }

        .input-area {
            padding: 20px 0;
            border-top: 1px solid var(--border);
        }

        .input-wrapper {
            display: flex;
            gap: 12px;
            align-items: center;
        }

        .text-input {
            flex: 1;
            padding: 14px 20px;
            border-radius: 25px;
            border: 1px solid var(--border);
            background: var(--bg-secondary);
            color: var(--text);
            font-size: 0.9rem;
            outline: none;
            transition: border-color 0.2s;
        }

        .text-input:focus {
            border-color: var(--primary);
        }

        .text-input::placeholder {
            color: var(--text-muted);
        }

        .btn {
            width: 48px;
            height: 48px;
            border-radius: 50%;
            border: none;
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
            transition: all 0.2s;
            flex-shrink: 0;
        }

        .btn-send {
            background: var(--primary);
            color: white;
        }

        .btn-send:hover {
            background: var(--primary-dark);
            transform: scale(1.05);
        }

        .btn-send:disabled {
            opacity: 0.5;
            cursor: not-allowed;
            transform: none;
        }

        .btn-mic {
            background: var(--bg-tertiary);
            color: var(--text);
            border: 2px solid var(--border);
        }

        .btn-mic:hover {
            border-color: var(--primary);
            color: var(--primary-light);
        }

        .btn-mic.recording {
            background: var(--error);
            border-color: var(--error);
            color: white;
            animation: micPulse 1s infinite;
        }

        .btn-voice {
            background: var(--bg-tertiary);
            color: var(--text-muted);
            border: 2px solid var(--border);
        }

        .btn-voice:hover {
            border-color: var(--primary);
            color: var(--primary-light);
        }

        .btn-voice.active {
            background: var(--success);
            border-color: var(--success);
            color: white;
        }

        @keyframes micPulse {
            0%, 100% { box-shadow: 0 0 0 0 rgba(239, 68, 68, 0.4); }
            50% { box-shadow: 0 0 0 12px rgba(239, 68, 68, 0); }
        }

        .btn svg {
            width: 20px;
            height: 20px;
        }

        .typing-indicator {
            display: flex;
            gap: 4px;
            padding: 12px 16px;
        }

        .typing-dot {
            width: 8px;
            height: 8px;
            border-radius: 50%;
            background: var(--text-muted);
            animation: typingBounce 1.4s infinite;
        }

        .typing-dot:nth-child(2) { animation-delay: 0.2s; }
        .typing-dot:nth-child(3) { animation-delay: 0.4s; }

        @keyframes typingBounce {
            0%, 60%, 100% { transform: translateY(0); }
            30% { transform: translateY(-8px); }
        }

        .welcome-message {
            text-align: center;
            padding: 40px 20px;
            color: var(--text-muted);
        }

        .welcome-message h2 {
            font-size: 1.3rem;
            color: var(--text);
            margin-bottom: 8px;
        }

        .welcome-message p {
            font-size: 0.85rem;
            line-height: 1.6;
        }

        .suggestions {
            display: flex;
            flex-wrap: wrap;
            gap: 8px;
            justify-content: center;
            margin-top: 20px;
        }

        .suggestion-chip {
            padding: 8px 16px;
            border-radius: 20px;
            background: var(--bg-secondary);
            border: 1px solid var(--border);
            color: var(--text);
            font-size: 0.8rem;
            cursor: pointer;
            transition: all 0.2s;
        }

        .suggestion-chip:hover {
            border-color: var(--primary);
            background: rgba(99, 102, 241, 0.1);
        }

        .speech-status {
            text-align: center;
            font-size: 0.8rem;
            color: var(--text-muted);
            margin-top: 8px;
            min-height: 20px;
        }

        .speech-status.active {
            color: var(--error);
            font-weight: 500;
        }

        .confidence-badge {
            display: inline-block;
            padding: 2px 8px;
            border-radius: 10px;
            font-size: 0.65rem;
            background: rgba(99, 102, 241, 0.2);
            color: var(--primary-light);
            margin-left: 8px;
        }

        .intent-info {
            display: flex;
            gap: 16px;
            padding: 8px 12px;
            margin-top: 6px;
            background: rgba(99, 102, 241, 0.08);
            border-radius: 10px;
            font-size: 0.75rem;
            border: 1px solid rgba(99, 102, 241, 0.15);
        }

        .intent-info .intent-label {
            color: var(--primary-light);
            font-weight: 500;
        }

        .intent-info .confidence-label {
            color: var(--success);
            font-weight: 500;
        }

        @media (max-width: 600px) {
            .chat-container {
                padding: 10px;
            }

            .message {
                max-width: 90%;
            }

            .header h1 {
                font-size: 1.2rem;
            }
        }

        .chat-messages::-webkit-scrollbar {
            width: 6px;
        }

        .chat-messages::-webkit-scrollbar-track {
            background: transparent;
        }

        .chat-messages::-webkit-scrollbar-thumb {
            background: var(--bg-tertiary);
            border-radius: 3px;
        }
    </style>
</head>
<body>
    <div class="header">
        <h1>VoiceBot</h1>
        <p>Voice-Enabled AI Chatbot with Deep Learning</p>
        <div class="status-bar">
            <div class="status-dot" id="statusDot"></div>
            <span id="statusText">Connecting...</span>
        </div>
    </div>

    <div class="chat-container">
        <div class="chat-messages" id="chatMessages">
            <div class="welcome-message">
                <h2>Welcome to VoiceBot!</h2>
                <p>I'm an AI chatbot powered by deep learning. You can talk to me using your voice or type your message below.</p>
                <div class="suggestions">
                    <div class="suggestion-chip" onclick="sendSuggestion('Hello')">Hello</div>
                    <div class="suggestion-chip" onclick="sendSuggestion('Tell me a joke')">Tell me a joke</div>
                    <div class="suggestion-chip" onclick="sendSuggestion('What time is it')">What time is it</div>
                    <div class="suggestion-chip" onclick="sendSuggestion('What can you do')">What can you do</div>
                    <div class="suggestion-chip" onclick="sendSuggestion('How are you')">How are you</div>
                </div>
            </div>
        </div>

        <div class="input-area">
            <div class="input-wrapper">
                <button class="btn btn-mic" id="micBtn" onclick="toggleRecording()" title="Hold to speak">
                    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                        <path d="M12 1a3 3 0 0 0-3 3v8a3 3 0 0 0 6 0V4a3 3 0 0 0-3-3z"/>
                        <path d="M19 10v2a7 7 0 0 1-14 0v-2"/>
                        <line x1="12" y1="19" x2="12" y2="23"/>
                        <line x1="8" y1="23" x2="16" y2="23"/>
                    </svg>
                </button>
                <input type="text" class="text-input" id="textInput" placeholder="Type a message or click the mic..." onkeypress="handleKeyPress(event)">
                <button class="btn btn-send" id="sendBtn" onclick="sendMessage()" title="Send message">
                    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                        <line x1="22" y1="2" x2="11" y2="13"/>
                        <polygon points="22 2 15 22 11 13 2 9 22 2"/>
                    </svg>
                </button>
                <button class="btn btn-voice active" id="voiceBtn" onclick="toggleVoice()" title="Toggle voice output">
                    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                        <polygon points="11 5 6 9 2 9 2 15 6 15 11 19 11 5"/>
                        <path d="M15.54 8.46a5 5 0 0 1 0 7.07"/>
                        <path d="M19.07 4.93a10 10 0 0 1 0 14.14"/>
                    </svg>
                </button>
            </div>
            <div class="speech-status" id="speechStatus"></div>
        </div>
    </div>

    <script>
        const API_URL = window.location.origin + '/chat';
        const chatMessages = document.getElementById('chatMessages');
        const textInput = document.getElementById('textInput');
        const micBtn = document.getElementById('micBtn');
        const sendBtn = document.getElementById('sendBtn');
        const statusDot = document.getElementById('statusDot');
        const statusText = document.getElementById('statusText');
        const speechStatus = document.getElementById('speechStatus');

        let recognition = null;
        let isRecording = false;
        let isServerOnline = false;
        let isVoiceEnabled = true;

        const voiceBtn = document.getElementById('voiceBtn');

        const SpeechRecognition = window.SpeechRecognition || window.webkitSpeechRecognition;

        if (SpeechRecognition) {
            recognition = new SpeechRecognition();
            recognition.continuous = false;
            recognition.interimResults = true;
            recognition.lang = 'en-US';

            recognition.onstart = () => {
                isRecording = true;
                micBtn.classList.add('recording');
                speechStatus.textContent = 'Listening...';
                speechStatus.classList.add('active');
            };

            recognition.onresult = (event) => {
                let interimTranscript = '';
                let finalTranscript = '';

                for (let i = event.resultIndex; i < event.results.length; i++) {
                    const transcript = event.results[i][0].transcript;
                    if (event.results[i].isFinal) {
                        finalTranscript += transcript;
                    } else {
                        interimTranscript += transcript;
                    }
                }

                if (finalTranscript) {
                    textInput.value = finalTranscript;
                    speechStatus.textContent = `Recognized: "${finalTranscript}"`;
                    sendMessage();
                } else if (interimTranscript) {
                    textInput.value = interimTranscript;
                    speechStatus.textContent = `Listening: "${interimTranscript}"`;
                }
            };

            recognition.onerror = (event) => {
                console.error('Speech recognition error:', event.error);
                let errorMsg = 'Speech recognition error';
                switch (event.error) {
                    case 'no-speech': errorMsg = 'No speech detected. Try again.'; break;
                    case 'audio-capture': errorMsg = 'No microphone found.'; break;
                    case 'not-allowed': errorMsg = 'Microphone access denied.'; break;
                    case 'network': errorMsg = 'Network error. Check your connection.'; break;
                }
                speechStatus.textContent = errorMsg;
                stopRecording();
            };

            recognition.onend = () => {
                stopRecording();
            };
        } else {
            micBtn.style.display = 'none';
            speechStatus.textContent = 'Speech recognition not supported in this browser. Use Chrome or Edge.';
        }

        function toggleRecording() {
            if (!recognition) return;

            if (isRecording) {
                recognition.stop();
            } else {
                try {
                    speechSynthesis.cancel();
                    recognition.start();
                } catch (e) {
                    console.error('Could not start recognition:', e);
                    speechStatus.textContent = 'Could not start microphone. Try refreshing.';
                }
            }
        }

        function stopRecording() {
            isRecording = false;
            micBtn.classList.remove('recording');
            setTimeout(() => {
                if (!isRecording) {
                    speechStatus.classList.remove('active');
                }
            }, 2000);
        }

        function toggleVoice() {
            isVoiceEnabled = !isVoiceEnabled;
            voiceBtn.classList.toggle('active', isVoiceEnabled);
            if (!isVoiceEnabled) {
                speechSynthesis.cancel();
            }
        }

        function speakResponse(text) {
            if (!isVoiceEnabled || !window.speechSynthesis) return;
            speechSynthesis.cancel();
            const utterance = new SpeechSynthesisUtterance(text);
            utterance.rate = 1.0;
            utterance.pitch = 1.0;
            utterance.volume = 1.0;
            utterance.lang = 'en-US';
            speechSynthesis.speak(utterance);
        }

        function handleKeyPress(event) {
            if (event.key === 'Enter') {
                sendMessage();
            }
        }

        function sendSuggestion(text) {
            textInput.value = text;
            sendMessage();
        }

        async function sendMessage() {
            const text = textInput.value.trim();
            if (!text) return;

            speechSynthesis.cancel();

            const welcomeMsg = document.querySelector('.welcome-message');
            if (welcomeMsg) {
                welcomeMsg.remove();
            }

            addMessage(text, 'user');
            textInput.value = '';
            sendBtn.disabled = true;

            const typingEl = addTypingIndicator();

            try {
                const response = await fetch(API_URL, {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ text: text })
                });

                if (!response.ok) {
                    throw new Error(`Server error: ${response.status}`);
                }

                const data = await response.json();

                removeTypingIndicator(typingEl);
                addMessage(data.response, 'bot', {
                    intent: data.intent,
                    confidence: data.confidence,
                    recognizedText: text
                });
                speakResponse(data.response);

            } catch (error) {
                console.error('Error:', error);
                removeTypingIndicator(typingEl);
                addMessage("Sorry, I'm having trouble connecting. Please try again.", 'bot');
            } finally {
                sendBtn.disabled = false;
                textInput.focus();
            }
        }

        function addMessage(text, sender, metadata = {}) {
            const messageEl = document.createElement('div');
            messageEl.className = `message ${sender}`;

            const avatar = document.createElement('div');
            avatar.className = 'message-avatar';
            avatar.textContent = sender === 'user' ? '👤' : '🤖';

            const content = document.createElement('div');
            content.className = 'message-content';

            if (metadata.recognizedText && sender === 'user') {
                const recognized = document.createElement('div');
                recognized.className = 'recognized-text';
                recognized.textContent = `🎤 Recognized: "${metadata.recognizedText}"`;
                content.appendChild(recognized);
            }

            const bubble = document.createElement('div');
            bubble.className = 'message-bubble';
            bubble.textContent = text;
            content.appendChild(bubble);

            const meta = document.createElement('div');
            meta.className = 'message-meta';
            const time = new Date().toLocaleTimeString([], { hour: '2-digit', minute: '2-digit' });
            meta.textContent = time;

            if (metadata.intent && sender === 'bot') {
                const intentInfo = document.createElement('div');
                intentInfo.className = 'intent-info';
                intentInfo.innerHTML = `
                    <span class="intent-label">Intent: ${metadata.intent}</span>
                    <span class="confidence-label">Confidence: ${(metadata.confidence * 100).toFixed(1)}%</span>
                `;
                content.appendChild(intentInfo);
            }

            content.appendChild(meta);
            messageEl.appendChild(avatar);
            messageEl.appendChild(content);
            chatMessages.appendChild(messageEl);

            chatMessages.scrollTop = chatMessages.scrollHeight;
        }

        function addTypingIndicator() {
            const messageEl = document.createElement('div');
            messageEl.className = 'message bot';
            messageEl.id = 'typing-indicator';

            const avatar = document.createElement('div');
            avatar.className = 'message-avatar';
            avatar.textContent = '🤖';

            const content = document.createElement('div');
            content.className = 'message-content';

            const bubble = document.createElement('div');
            bubble.className = 'message-bubble typing-indicator';
            bubble.innerHTML = '<div class="typing-dot"></div><div class="typing-dot"></div><div class="typing-dot"></div>';

            content.appendChild(bubble);
            messageEl.appendChild(avatar);
            messageEl.appendChild(content);
            chatMessages.appendChild(messageEl);
            chatMessages.scrollTop = chatMessages.scrollHeight;

            return messageEl;
        }

        function removeTypingIndicator(el) {
            if (el && el.parentNode) {
                el.parentNode.removeChild(el);
            }
        }

        async function checkHealth() {
            try {
                const response = await fetch(window.location.origin + '/health');
                if (response.ok) {
                    const data = await response.json();
                    if (data.status === 'healthy') {
                        isServerOnline = true;
                        statusDot.classList.remove('disconnected');
                        statusText.textContent = 'Connected';
                        return;
                    }
                }
                throw new Error('Server not healthy');
            } catch (e) {
                isServerOnline = false;
                statusDot.classList.add('disconnected');
                statusText.textContent = 'Disconnected';
            }
        }

        checkHealth();
        setInterval(checkHealth, 30000);

        textInput.focus();
    </script>
</body>
</html>
